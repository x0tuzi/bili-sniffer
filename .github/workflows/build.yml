name: Build Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyinstaller requests browser_cookie3 cryptography
      - run: pyinstaller --onefile --name bili-sniffer-linux bilibili_sniffer.py
      - uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/bili-sniffer-linux
          asset_name: bili-sniffer-linux
          asset_content_type: application/octet-stream

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyinstaller requests browser_cookie3 cryptography
      - run: pyinstaller --onefile --name bili-sniffer-windows.exe bilibili_sniffer.py
      - uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/bili-sniffer-windows.exe
          asset_name: bili-sniffer-windows.exe
          asset_content_type: application/octet-stream
